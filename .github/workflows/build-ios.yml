name: build-ios

# 产出：Wallet-unsigned.ipa（xcodegen + xcodebuild，无签名）
#
# 触发：手动 workflow_dispatch 或推送 ios-shell/
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-shell/**'
      - '.github/workflows/build-ios.yml'

jobs:
  ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          echo "=== runner ==="
          sw_vers
          xcodebuild -version
          echo "=== repo ==="
          ls -la
          echo "=== ios-shell ==="
          ls -la ios-shell

      - name: 安装 xcodegen
        run: |
          set -e
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成工程
        working-directory: ios-shell
        run: |
          set -e
          xcodegen generate
          ls -la

      - name: 归档（无签名）
        working-directory: ios-shell
        run: |
          set -e
          xcodebuild \
            -project Wallet.xcodeproj \
            -scheme Wallet \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Wallet.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ARCHS=arm64 \
            archive 2>&1 | tail -40
          echo "=== archive 产物 ==="
          ls -la build/ || true
          ls -la build/Wallet.xcarchive/Products/Applications/ || true

      - name: 打包 unsigned IPA
        working-directory: ios-shell
        run: |
          set -e
          APP="build/Wallet.xcarchive/Products/Applications/Wallet.app"
          if [ ! -d "$APP" ]; then
            echo "Wallet.app 不存在，列出目录："
            find build -maxdepth 4 -type d | head -30
            exit 1
          fi
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          rm -rf build/Payload/Wallet.app/_CodeSignature || true
          cd build
          zip -qry Wallet-unsigned.ipa Payload
          ls -lh Wallet-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Wallet-unsigned-ipa
          path: ios-shell/build/Wallet-unsigned.ipa
          if-no-files-found: error
